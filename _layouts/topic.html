---
layout: default
---

<div class="section-title">
  <h1>{{ page.title }}</h1>
  <p>{{ page.description }}</p>
</div>

<div class="topic-list">
  {% assign posts = site.categories[page.category] %}
  
  {% for post in posts %}
  <div class="topic-list-item">
    <h3><a href="{{ post.url }}">{{ post.title }}</a></h3>
    <span class="topic-list-date">{{ post.date | date: "%B %d, %Y" }}</span>
  </div>
  {% endfor %}
  
  {% if posts.size == 0 %}
  <p style="text-align: center; color: var(--text-muted); padding: 2rem;">No posts found in this category yet.</p>
  {% endif %}
</div>
